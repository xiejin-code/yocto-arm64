# Boot delay (seconds) before auto-boot so the Rockchip U-Boot
# ("Hit key to stop autoboot('CTRL+C'): N") can be interrupted with Ctrl+C.
# NOTE: this U-Boot has CONFIG_ENV_IS_NOWHERE, so `setenv bootdelay` does
# NOT survive a reboot - the delay must be baked in at build time (here).
CONFIG_BOOTDELAY=2
