#@TYPE: Machine
#@NAME: FZHub RK3568
#@DESCRIPTION: Initial machine configuration skeleton for the RK3568-based FZHub platform

require conf/machine/include/fzhub.inc

# Board-specific boot settings will be added when the hardware definition is
# available. At minimum, a real image build will need appropriate values for:
KERNEL_DEVICETREE = "rockchip/rk3568-atk-evb1-ddr4-v10-linux.dtb"
UBOOT_MACHINE = "rk3568_defconfig"

PREFERRED_PROVIDER_virtual/kernel = "linux-rockchip"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-rockchip"

PREFERRED_VERSION_linux-xlnx = "5.10%"

# glibc uses OLDEST_KERNEL as the minimum target runtime kernel it supports.
# Keep it aligned with the Rockchip 5.10 kernel headers used by this machine.
OLDEST_KERNEL = "5.10.0"